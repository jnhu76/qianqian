[package]
name = "binding-parity-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "#172 S2 G3 binding-parity runner: the C-suite scenario (csuite_consumer.c) executed through the existing Rust binding path (qianqian-songcore-sys raw + qianqian-decode-songcore adapter) against the SAME artifact and the SAME media, compared field-by-field with the recorded C-suite receipts."

[dependencies]
qianqian-songcore-sys = { path = "../../../../crates/qianqian-songcore-sys" }
qianqian-decode-songcore = { path = "../../../../crates/qianqian-decode-songcore" }
qianqian-audio-api = { path = "../../../../crates/qianqian-audio-api" }
qianqian-composition = { path = "../../../../crates/qianqian-composition" }
qianqian-app = { path = "../../../../crates/qianqian-app" }
serde_json = "1"

# Standalone unit (same mechanics as the two binding crates): the SongCore
# artifact is linked separately from native/build/artifacts and this runner
# is release-lane evidence, not a workspace member.
[workspace]

[profile.release]
opt-level = 2
