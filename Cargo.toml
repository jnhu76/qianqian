[workspace]
resolver = "3"
members = [
    "apps/headless",
    "crates/qianqian-audio-api",
    "crates/qianqian-composition",
    "crates/qianqian-output-wasapi",
    "crates/qianqian-playback",
    "crates/qianqian-app",
]
exclude = [
    "crates/qianqian-decode-songcore",
    "crates/qianqian-songcore-sys",
    "experiments/songcore-call-comparison",
    "experiments/f3-pause-mechanism",
    "experiments/f4-timeline-gate",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
