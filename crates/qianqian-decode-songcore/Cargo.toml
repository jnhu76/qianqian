[package]
name = "qianqian-decode-songcore"
version = "0.1.0"
edition = "2024"
publish = false
description = "Real Decode capability provider over the SongCore C ABI v1"

[dependencies]
qianqian-audio-api = { path = "../qianqian-audio-api" }
# The host-owned diagnostic outlet (error-system target contract §DG-1/DG-3):
# a diagnostic sink for the retained typed fault, never a semantic authority.
qianqian-diagnostics = { path = "../qianqian-diagnostics" }
qianqian-composition = { path = "../qianqian-composition" }
qianqian-songcore-sys = { path = "../qianqian-songcore-sys" }

[dev-dependencies]
qianqian-app = { path = "../qianqian-app" }
serde_json = "1"

# The enclosing workspace excludes this crate (it links the separately-built
# SongCore native artifact), so it compiles as its own unit with this lockfile.
# Declaring the (empty) workspace root here keeps `cargo test --manifest-path`
# working from any checkout depth — a linked git worktree under the main
# checkout would otherwise latch onto the main workspace's manifest above it,
# whose exclude paths do not match this checkout's location.
[workspace]
