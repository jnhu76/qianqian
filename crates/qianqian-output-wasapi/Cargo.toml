[package]
name = "qianqian-output-wasapi"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Real WASAPI Output capability provider (shared mode, event-driven)"

[dependencies]
qianqian-core = { path = "../qianqian-core" }
qianqian-kernel = { path = "../qianqian-kernel" }

[dev-dependencies]
qianqian-runtime = { path = "../qianqian-runtime" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
