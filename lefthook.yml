# Qianqian local verification gate — Lefthook pre-push.
#
# Role split (see AGENTS.md "Verification" and CONTRIBUTING.md):
#   - This hook is the FAST LOCAL REJECTION layer. It runs checks only:
#     no formatting, no auto-fixing, no staging, no commits, no network.
#   - GitHub Actions remains the authority for platform, formal (TLA+),
#     Miri/Loom, mutation, Windows and release evidence.
#
# Canonical manual entrypoint (AI agents and humans):
#
#     lefthook run pre-push --all-files
#
# `--all-files` forces the file templates to the full tree, so the
# manual run always executes the complete gate. (A bare manual run
# filters on Lefthook's native push-file list, which is empty when the
# branch has no unpushed file changes — a vacuous pass.)
#
# Path-awareness on real pushes: commands with `glob` run only when the
# push touches matching files, using Lefthook's native push-file
# detection (`git diff HEAD @{push}`, falling back to the branch delta
# against origin/HEAD). That list is non-empty whenever a push actually
# changes content, so the gate can only narrow on a real, known delta —
# it never silently skips a real change.
#
# `piped` + `priority` keeps the Cargo steps sequential (one cargo at a
# time; no target/ lock contention) and stops on the first red check,
# cheapest first. The non-Cargo checks are sub-second, so measured
# wall-clock overlap would save ~1s: parallelism is not justified.
#
# Note: `python3` must be on PATH (same interpreter contract as CI and
# the tools/*.py shebangs).

min_version: 2.1.16

pre-push:
  piped: true
  commands:
    commit-convention:
      # Commit headers, not files: no glob, runs on every gate pass.
      # Validates the checker itself, then exactly the commits ahead of
      # the push base (origin/main..HEAD) — the set a push from this ref
      # would carry. An empty range passes (nothing local to validate).
      # Replaces the former commit-convention.yml CI job; that job's
      # PR-title half has no local equivalent (a PR title does not exist
      # locally), so PR titles are author-checked against the same
      # header rule (docs/development/commit-convention.md).
      priority: 1
      run: |
        python3 tools/check_commit_convention.py --self-test &&
        python3 tools/check_commit_convention.py --range origin/main HEAD

    vocabulary:
      priority: 2
      run: python3 tools/check_architecture_vocabulary.py

    plugin-boundary:
      priority: 3
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        # toolchain/lint config a future file would silently miss:
        - "rust-toolchain.toml"
        - "rustfmt.toml"
        - "clippy.toml"
        - ".cargo/**"
        - "crates/**"
        - "apps/**"
        # the checker itself is part of its own gate:
        - "tools/check_plugin_boundaries.py"
      run: |
        # the gate plus its negative controls (non-vacuity) — the same
        # two steps the CI plugin-boundary job runs
        python3 tools/check_plugin_boundaries.py &&
        python3 tools/check_plugin_boundaries.py --negative-controls

    rust-fmt:
      priority: 4
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        - "rust-toolchain.toml"
        - "rustfmt.toml"
        - "clippy.toml"
        - ".cargo/**"
        - "crates/**"
        - "apps/**"
      run: cargo fmt --check

    rust-clippy:
      priority: 5
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        - "rust-toolchain.toml"
        - "rustfmt.toml"
        - "clippy.toml"
        - ".cargo/**"
        - "crates/**"
        - "apps/**"
      run: cargo clippy --workspace --all-targets -- -D warnings

    rust-test:
      priority: 6
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        - "rust-toolchain.toml"
        - "rustfmt.toml"
        - "clippy.toml"
        - ".cargo/**"
        - "crates/**"
        - "apps/**"
      run: cargo test --workspace

    docs-verify:
      # priority 0 = runs last; for a docs-only push the Cargo commands
      # above are skipped, so this still completes in well under a
      # minute. The full Observatory treatment the former docs.yml CI
      # job ran: verify.mjs (registry / truth-class / provenance
      # checks) plus the real VitePress build, which catches config and
      # dead-link errors verify.mjs cannot see. Both are deterministic
      # and offline once dependencies exist; the one-time networked
      # prerequisite stays outside this gate:
      #   cd website && npm ci
      # Build output (website/.vitepress/dist) is gitignored — the gate
      # leaves the working tree unchanged.
      priority: 0
      glob:
        - "docs/**"
        - "website/**"
      run: |
        cd website
        node scripts/verify.mjs
        if [ ! -d node_modules ]; then
          echo "docs:build prerequisite missing: website dependencies not installed."
          echo "Run once:  cd website && npm ci"
          exit 1
        fi
        npx vitepress build
