name: Feature request
description: 提议一个新的产品或系统能力
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 要解决什么问题
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: User / system value
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: 明确不做什么
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - product / PRD
        - SongCore
        - PlayerEngine
        - AudioEngine / DSP / SRC
        - AudioBackend
        - FFmpeg closure / build
        - WASM
        - KMP / FFI boundary
        - docs
    validations:
      required: true
