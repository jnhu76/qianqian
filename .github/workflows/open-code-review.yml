name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get PR context for manual trigger
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Review PR with OpenCodeReview
        uses: alibaba/open-code-review@04284b5dc19e0f52528ca466a767e4a2c100e5f5
        with:
          ocr_version: '1.11.6'
          llm_url: https://opencode.ai/zen/go/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: mimo-v2.5
          llm_use_anthropic: 'false'
          llm_extra_headers: 'x-opencode-session=${{ github.repository }}-pr-${{ github.event.pull_request.number || github.event.issue.number }}'
          llm_extra_body: '{}'
          language: Chinese
          effort: high
          llm_timeout: '300'
          review_task_timeout: '20'
          stream_progress: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          route_severity_below: low
          route_categories: style
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          background: >-
            Qianqian is a Rust local-first music player and architecture testbed.
            Review changes against explicit semantic-authority boundaries: the
            Composition Kernel owns reachability/ownership/lifetime rather than
            application payloads; capability/control plane must remain distinct
            from the audio data plane; MusicKernel and TransportKernel have
            separate authorities; TrackSession/DecodeSession lifetime and
            playback generation/fence semantics must not be blurred. Prioritize
            correctness, lifetime/ownership, concurrency, state-machine errors,
            accidental architectural authority expansion, code/docs/ADR drift,
            and missing executable evidence. Prefer minimal fixes over framework
            growth, and do not treat historical documents as current authority.
