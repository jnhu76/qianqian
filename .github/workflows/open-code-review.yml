name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get PR context for manual trigger
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Review PR with OpenCodeReview
        uses: alibaba/open-code-review@04284b5dc19e0f52528ca466a767e4a2c100e5f5
        with:
          ocr_version: '1.11.6'
          llm_url: https://opencode.ai/zen/go/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: mimo-v2.5
          llm_use_anthropic: 'false'
          llm_extra_headers: 'x-opencode-session=${{ github.repository }}-pr-${{ github.event.pull_request.number || github.event.issue.number }}'
          llm_extra_body: '{}'
          language: Chinese
          effort: high
          llm_timeout: '300'
          review_task_timeout: '20'
          stream_progress: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          route_severity_below: low
          route_categories: style
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          background: >-
            Qianqian is a Rust local-first music player and architecture testbed.
            The generic Composition Kernel owns reachability/lifecycle rather
            than application payloads; its primitive budget
            (Context/Capability/Fiber/Effect/Reconcile) is frozen. Playback
            Foundations are ACCEPTED (ADR-PBK-001): they separate four
            reasoning lenses (Composition, Execution/Control, Fact, Realtime
            Data) and deliberately do not freeze playback state-machine nouns.
            Legacy
            MusicKernel/TransportKernel/TrackSession/DecodeSession/Generation/
            Fence code and specs are experimental evidence, not authority, and
            neither the legacy model nor any new noun may be treated as
            accepted architecture. Review work against the accepted
            foundations: does it violate them, does it accidentally re-promote
            legacy evidence into authority, does it confuse command vs fact vs
            projection vs hot data, does it forge a semantic fact from
            mechanism evidence without the designated authority for that
            fact's kind and subject scope (fact-authority identity follows
            ADR-PBK-001 §2.3), or manufacture a second writer of the same
            semantic truth about the same subject by renaming or splitting
            fact kinds/scopes, does
            it use a projection as a control-correctness authority, does it
            treat "commit" as implying durability/ACID, does it violate K0
            isolation, does it release resources while realtime readers can
            still dereference them, or does it break lifetime/concurrency
            correctness or code/docs/ADR consistency? Prefer minimal fixes; do
            not preserve legacy playback nouns merely because old code/specs
            contain them.
