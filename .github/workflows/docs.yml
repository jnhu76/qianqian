name: Observatory CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'

jobs:
  docs-verify:
    name: Verify & Build Observatory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run docs:verify
        run: node scripts/verify.mjs

      - name: Build VitePress
        run: npx vitepress build

# The former `rust-regression` job (fmt/check/test/clippy under the
# docs/website path trigger) moved to rust-regression.yml: docs-only
# changes cannot affect Rust compilation (no workspace crate includes
# docs/ or website/ content and no workspace crate has a build.rs), so
# that trigger was structurally miscoped — docs-only pushes paid full
# Rust regression while Rust-only pushes paid none.
