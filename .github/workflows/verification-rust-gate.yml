name: Verification Rust Gate

# Durable gate for the CURRENT Rust-side verification evidence: the
# qianqian-composition scenario matrices (native + Miri) with their
# production mutation negative controls (specs/composition-kernel-0-rust),
# and the real-PcmEdge Loom concurrency suite with its negative control
# (specs/playback-concurrency), via specs/check.sh rust — plus the F5
# seek-implementation production mutation gate
# (specs/f5-seek-implementation/check.sh, called directly so the F5 TLA
# suite is not re-run here; the formal side of F5 lives in the Formal
# Semantic Gate).
#
# Toolchain contract (fail-closed preflight below enforces it):
#   plain rustc/cargo   = stable  — native matrices, §G.6 dependent-consumer
#                                   oracle, production mutations, loom
#   cargo +nightly miri = nightly — the Miri channel only
# The dtolnay toolchain action sets the rustup default on every install,
# so stable MUST be the LAST toolchain installed. (Hosted-run evidence
# before this fix: run 34913770412 installed nightly last and then ran
# the whole "native" channel under nightly.)
#
# Fail-closed contract: dirty production file, missing nightly-miri
# toolchain, a matrix failure, a Miri finding, a mutation that is no
# longer caught, a lost loom deadlock, or any nonzero runner exit fails
# this workflow. No continue-on-error, no || true, no allowed failure.
# The f5-implementation job adds: its native regression must come back
# green and non-empty, every one of the M1–M11 production patches must
# apply AND be caught by its targeted suite, and the touched files must
# restore byte-exact — a green mutated run is TOOLING-FAIL there.
#
# Trigger paths are repository-reality scoped: the verified production
# crates (kernel + playback + audio-api + the diagnostics pool), the suite
# definitions themselves, and the authority documents the Rust refinement
# evidence is checked against (K0 design/implementation ADRs — the
# composition refinement matrix claims them; ADR-PBK-002 D8/D11 — the PCM
# data-plane boundary and the episode terminal-outcome authority realized
# by qianqian-playback). crates/qianqian-diagnostics IS listed: the
# playback session registers its class-α pool (the decode worker's only
# creation site), so the pool crate is compiled by this gate's playback
# partition — under `--cfg loom` too — and the playback-concurrency lane
# runs its two schedule tests. crates/qianqian-audio-api IS listed: its src/
# ports.rs hosts the F5 implementation mutation targets RenderGate /
# TailProbeOutcome / PositionEvidence (M4/M11 patch set), and the P1–P5
# test-local candidate harness under its tests/ stays covered by the
# ordinary rust-regression workflow. One artifact from the formal
# side IS listed: the settlement decision table
# (specs/episode-terminal-settlement/CurrentDecisionTable.tla) is
# frozen from the production resolver by the exhaustive Rust oracle
# (crates/qianqian-playback/src/decision_table_oracle.rs, run by
# this gate's playback native regression; crate-internal since F2), so hand-editing the artifact
# re-runs the oracle here while the Formal Semantic Gate re-checks the
# table against the TLA decision functions.
#
# A green run states: bounded verification (scenario matrices + Miri +
# loom, with all mutation negative controls caught) found no violation
# within the stated bounds (specs/*/RESULTS.md). It is NOT architecture
# acceptance.
#
# Cost note: Miri here is the ~1-minute 7-matrix pass over
# qianqian-composition (see specs/composition-kernel-0-rust/RESULTS.md),
# not a cross-workspace Miri campaign. The f5-implementation job is
# ~1 native regression + 11 bounded targeted mutation runs (each capped
# by the runner's own 900 s timeout) over the already-built
# playback/audio-api test targets.

on:
  pull_request:
    paths:
      - "crates/qianqian-composition/**"
      - "crates/qianqian-playback/**"
      - "crates/qianqian-audio-api/**"
      # The host diagnostic outlet (error-system target contract §DG-1):
      # compiled inside the playback partition and its loom build (the
      # session registers the class-α pool), so pool changes can break
      # this gate and must re-trigger it.
      - "crates/qianqian-diagnostics/**"
      - "specs/composition-kernel-0-rust/**"
      - "specs/playback-concurrency/**"
      # F5 implementation mutation gate: the patch set itself and the
      # three production files it patches (completion.rs / session.rs /
      # ports.rs — the latter via the audio-api trigger above).
      - "specs/f5-seek-implementation/**"
      # Decision-table refinement-oracle artifact: frozen from
      # completion.rs by the exhaustive oracle this gate runs.
      - "specs/episode-terminal-settlement/CurrentDecisionTable.tla"
      - "specs/check.sh"
      - "docs/architecture/composition-kernel-0-design.md"
      - "docs/architecture/composition-kernel-0-implementation-adr.md"
      - "docs/adr/ADR-PBK-002.md"
      - ".github/workflows/verification-rust-gate.yml"
  push:
    branches: [main]
    paths:
      - "crates/qianqian-composition/**"
      - "crates/qianqian-playback/**"
      - "crates/qianqian-audio-api/**"
      # The host diagnostic outlet (see pull_request above).
      - "crates/qianqian-diagnostics/**"
      - "specs/composition-kernel-0-rust/**"
      - "specs/playback-concurrency/**"
      # F5 implementation mutation gate (see pull_request above).
      - "specs/f5-seek-implementation/**"
      # Decision-table refinement-oracle artifact (see pull_request).
      - "specs/episode-terminal-settlement/CurrentDecisionTable.tla"
      - "specs/check.sh"
      - "docs/architecture/composition-kernel-0-design.md"
      - "docs/architecture/composition-kernel-0-implementation-adr.md"
      - "docs/adr/ADR-PBK-002.md"
      - ".github/workflows/verification-rust-gate.yml"

concurrency:
  group: verification-rust-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-verification:
    name: matrices + Miri + mutations + loom (specs/check.sh rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Nightly FIRST: each dtolnay install sets the rustup default, so
      # the LAST install (stable below) owns the plain rustc/cargo path.
      - name: Install nightly Rust with Miri (fail closed if unavailable)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install stable Rust (default workspace toolchain)
        uses: dtolnay/rust-toolchain@stable

      # Fail-closed preflight: print the actual channels and refuse to
      # run if plain rustc is nightly. The permanent invariant is the
      # channel split, not any pinned version number.
      - name: Toolchain preflight (native channel must be stable)
        run: |
          rustc --version
          cargo --version
          ACTIVE="$(rustup show active-toolchain)"
          echo "active toolchain: $ACTIVE"
          rustc +nightly --version
          cargo +nightly miri --version
          echo "NATIVE_TOOLCHAIN=$(rustc --version)"
          echo "MIRI_TOOLCHAIN=$(cargo +nightly miri --version)"
          if rustc --version | grep -q nightly; then
            echo "ERROR: native verification must run on stable (active: $ACTIVE)" >&2
            exit 1
          fi

      - name: Rust-side verification (specs/check.sh rust)
        run: specs/check.sh rust

  # F5 seek implementation mutation gate — the eleven production
  # patches (M1–M11) over completion.rs / session.rs / ports.rs, each
  # of which must be CAUGHT by its targeted executable suite. Called
  # directly (not via `specs/check.sh f5`) so the F5 TLA suite is not
  # re-run here: the formal side of F5 belongs to the Formal Semantic
  # Gate. Stable toolchain only — no Miri/loom dependency. The runner
  # is fail-closed by design (refuses dirty files; a green mutated run
  # is TOOLING-FAIL; byte-exact restore verified after every mutation).
  f5-implementation-mutations:
    name: F5 seek implementation mutations (specs/f5-seek-implementation/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight — stable toolchain must be active
        run: |
          rustc --version
          cargo --version

      - name: F5 implementation mutation gate
        run: specs/f5-seek-implementation/check.sh
