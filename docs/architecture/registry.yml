  - id: ARCH-003
    name: Playback Foundations
    version: 2
    status: CURRENT

    # Playback Foundations accepted via ADR-PBK-001 (PR #87). The accepted
    # foundations fix plane boundaries and contracts only; they deliberately
    # do not re-freeze legacy playback state-model nouns, and old playback
    # code/specs remain experimental evidence only.
    diagram:
