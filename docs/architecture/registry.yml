# Registry conventions (governance note, not a second authority):
#
# `authority` lists ONLY files designated as normative authority for the
# entry's semantic class (see docs/README.md "Authority model"):
#   - Playback foundations / Fact / P1-P5       -> docs/adr/ADR-PBK-001.md
#   - Current vocabulary + first static playback -> docs/adr/ADR-PBK-002.md
#   - K0 semantic design authority              -> composition-kernel-0-design.md
#   - K0 implementation decisions               -> composition-kernel-0-implementation-adr.md
# `docs/architecture/overview.md` is a derived architecture summary/router —
# it is NEVER listed as authority; it is referenced in comments as the summary
# surface. Diagrams under docs/architecture/diagrams/ are visual projections.

architectures:
  - id: ARCH-001
    name: Qianqian System
    version: 1
    status: CURRENT

    diagram:
      source: docs/architecture/diagrams/ARCH-001-qianqian-system-v1.mmd
      frozen: true

    # The v1 system diagram is a frozen historical visual projection. Plane
    # separation remains normative via ADR-PBK-001; current role names and the
    # first earned static playback composition are normative via ADR-PBK-002.
    # Legacy nouns such as MusicKernel/UiHost in the frozen diagram do not
    # override current vocabulary.
    authority:
      - docs/adr/ADR-PBK-001.md
      - docs/adr/ADR-PBK-002.md

    decisions:
      - issue: 46
      - issue: 53
      - pr: 66
      - pr: 117
      - pr: 118

    implementation:
      - issue: 70
      - pr: 71
      - pr: 117

    evidence:
      - crates/qianqian-composition/tests
      - crates/qianqian-audio-api/src
      - crates/qianqian-app/src
      - crates/qianqian-playback/src

