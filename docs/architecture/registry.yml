      - pr: 91

    implementation: []

    evidence:
      # Current formal evidence for the ADR §6 P1–P5 publication/reclamation
      # semantic contract (mechanism/representation remain OPEN; Phase D
      # validates candidate mechanisms against P1–P5).
      - specs/realtime-publication/RealtimePublication.tla
      - specs/realtime-publication/README.md
      # Prior playback code/specs are retained as experimental evidence only
      # under accepted/current ARCH-003 foundations, while production playback
      # semantics remain open. They do not close current design questions.
      # PRs #78/#79/#81 (former ADR acceptance chain) and PR #82 (former
      # executable core) are experimental/historical evidence, NOT current
      # architecture decisions.
      - git tag playback-reference-v1
      - specs/playback/PlaybackTemporal.tla
      - specs/playback/PlaybackOwnership.tla
      - specs/playback/README.md
      - crates/qianqian-core/src/music.rs
      - crates/qianqian-core/src/transport.rs
      - crates/qianqian-core/tests/playback_temporal_traces.rs
      # Historical v1 diagram of the superseded playback-kernel model; kept as
      # historical artifact, referenced by no current authority.
      - docs/architecture/diagrams/ARCH-003-playback-kernel-v1.mmd

