[package]
name = "f6-source-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "F6-S-PROBE evidence: a second SongCore native handle probes a candidate source while the live episode keeps decoding/rendering"

# F6-S-PROBE evidence crate (Issue #119 F6 Open gate; the S-PROBE slice
# sequenced between the F5 merge and the F6 authority promotion).
# Workspace-excluded on purpose: executable mechanism evidence, NOT
# production architecture. Nothing here may be imported by any
# qianqian-* crate; production behavior delta in this slice is ZERO —
# the harness consumes the production crates as they exist on the base
# commit and drives the second native handle directly over
# qianqian-songcore-sys, mirroring (never modifying) the production
# open→probe→close sequence.

# Self-contained evidence crate: an empty [workspace] table keeps cargo
# from walking up into the production workspace without touching the
# root manifest (production delta stays zero).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qianqian-app = { path = "../../crates/qianqian-app" }
qianqian-composition = { path = "../../crates/qianqian-composition" }
qianqian-playback = { path = "../../crates/qianqian-playback" }
qianqian-decode-songcore = { path = "../../crates/qianqian-decode-songcore" }
qianqian-output-wasapi = { path = "../../crates/qianqian-output-wasapi" }
# The second native handle is the load-bearing subject: the probe drives
# the same ABI the live episode's decode mechanism uses, on its own
# independent handle.
qianqian-songcore-sys = { path = "../../crates/qianqian-songcore-sys" }
