[package]
name = "qianqian-headless"
version.workspace = true
edition.workspace = true
description = "Headless bootstrap of Architecture v2: composition-only real playback entry"

[dependencies]
qianqian-composition = { path = "../../crates/qianqian-composition" }
qianqian-playback = { path = "../../crates/qianqian-playback" }
qianqian-app = { path = "../../crates/qianqian-app" }
qianqian-decode-songcore = { path = "../../crates/qianqian-decode-songcore", optional = true }
qianqian-output-wasapi = { path = "../../crates/qianqian-output-wasapi", optional = true }
# Presentation-only dependencies of the reference-player TUI shell. They
# are admitted here deliberately and nowhere else: no qianqian-* crate
# may take them (the plugin boundary gate fail-closes every unadmitted
# internal edge), and they never cross the F2 episode seam.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
# Test admission only (plugin-boundary hardening H2A / audit H-b): the
# status-projection tests build observations over the shared PcmFormat
# contract. Production headless must NOT depend on audio-api — the role
# boundary for shared contracts (DrainSignal, PcmFormat, RenderRequest)
# is enforced by the Cargo architecture gate (tools/check_plugin_boundaries.py).
qianqian-audio-api = { path = "../../crates/qianqian-audio-api" }

[features]
default = []
# Binary-local feature: gates the real playback slice (requires native SongCore
# artifacts). Kept for the capability it enables, not the underlying crates.
# This is NOT a library public API feature.
playback = ["dep:qianqian-decode-songcore", "dep:qianqian-output-wasapi"]
