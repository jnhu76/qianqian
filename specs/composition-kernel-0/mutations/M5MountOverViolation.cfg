SPECIFICATION Spec

\* 负控制 run 只查目标 invariant：mutation 分支会产生海量 violation
\* report，TLC 1.7.4 在数千条 error trace 后会内部崩溃并截断探索
\*（exit 75/255，ArrayIndexOutOfBoundsException，队列非空）——violated
\* 集因此不确定。收窄到目标 invariant + 收紧 churn 界（MaxRevisions=2、
\* MaxActivations=1）后探索完整、结果确定。mutation gate 的主张是
\* 「target 被 counterexample 击中」，不是覆盖声明。
INVARIANT
    SingleSource

CONSTANTS
    Entries = {C, P1, P2}
    C = C
    P1 = P1
    P2 = P2
    K = K
    NoOne = NoOne
    Mutation = MutationMountOverViolation
    MutationNone = MutationNone
    MutationDropReliedGuard = MutationDropReliedGuard
    MutationRemoveBeforeDischarge = MutationRemoveBeforeDischarge
    MutationEarlyReplacement = MutationEarlyReplacement
    MutationDoubleInverse = MutationDoubleInverse
    MutationMountOverViolation = MutationMountOverViolation
    MaxActivations = 1
    MaxEffects = 1
    MaxRevision = 1
    MaxRevisions = 2
