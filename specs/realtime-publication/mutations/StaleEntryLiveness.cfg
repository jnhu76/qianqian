\* M3 负控制 NewReaderMayEnterOldView（liveness 侧）：同一 StaleEntry 缺陷，
\* 但只携带 TypeOK + temporal property，让 TLC 完整探索并给出 liveness
\* counterexample（lasso：旧视图被反复进入/退出，永远无法 quiesce，
\* 资源永远到不了 reclaimable —— 即使不发生直接 use-after-release）。
\* 预期：ReplacementEventuallyReclaimable 必须失败（Temporal properties violated）。
CONSTANT
Readers                           = {r1, r2}
Resources                         = {A}
OldResource                       = A
ChainResource                     = B
MaxPublications                   = 1
Mutation                          = MutationStaleEntry
MutationNone                      = MutationNone
MutationReleaseBeforeQuiesce      = MutationReleaseBeforeQuiesce
MutationSplitPublication          = MutationSplitPublication
MutationStaleEntry                = MutationStaleEntry
MutationForgetsOlderRetirement    = MutationForgetsOlderRetirement

SPECIFICATION Spec

INVARIANT
TypeOK

PROPERTY
ReplacementEventuallyReclaimable
