\* M3 负控制 NewReaderMayEnterOldView（safety 侧）：发布 N+1 后闭门条件被撤，
\* 新 reader acquisition 仍可进入已 retired 的 N。
\* 预期：NoReaderAcquiresRetiredView 必须失败。
\* 附带杀伤（TLC 单独以 I1 为不变式时可见）：MarkReclaimable 认证后发生
\* stale entry，会产生 reclaimable-with-holder，I1 同步失败——标准 -continue
\* run 中 I3 先失败会掩盖该状态级报告。
\* liveness 侧的同一缺陷（旧视图永无法 quiesce -> 永无法回收）见
\* StaleEntryLiveness.cfg；Safety 与 Liveness 是两回事，分开取证。
CONSTANT
Readers                           = {r1, r2}
Resources                         = {A}
OldResource                       = A
ChainResource                     = B
MaxPublications                   = 1
Mutation                          = MutationStaleEntry
MutationNone                      = MutationNone
MutationReleaseBeforeQuiesce      = MutationReleaseBeforeQuiesce
MutationSplitPublication          = MutationSplitPublication
MutationStaleEntry                = MutationStaleEntry
MutationForgetsOlderRetirement    = MutationForgetsOlderRetirement

SPECIFICATION Spec

INVARIANT
TypeOK
ViewIsCoherent
NoReaderAcquiresRetiredView
NoReaderDereferencesReleasedResource
ReleaseRequiresCertifiedQuiescence
