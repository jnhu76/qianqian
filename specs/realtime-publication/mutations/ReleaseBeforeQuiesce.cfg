\* M1 负控制 ReleaseBeforeReadersQuiesce：发布 N+1 后未等读者 quiescence、
\* 未做认证即直接释放资源（retired -> released 跳步）。
\* 预期：NoReaderDereferencesReleasedResource 必须失败（counterexample 形状：
\* R 进入 N -> 发布 N+1 -> 释放 A -> R 仍持有含 A 的旧视图）；
\* ReleaseRequiresCertifiedQuiescence 同步失败（未经认证即释放）。
CONSTANT
Readers                           = {r1, r2}
Resources                         = {A}
OldResource                       = A
ChainResource                     = B
MaxPublications                   = 1
Mutation                          = MutationReleaseBeforeQuiesce
MutationNone                      = MutationNone
MutationReleaseBeforeQuiesce      = MutationReleaseBeforeQuiesce
MutationSplitPublication          = MutationSplitPublication
MutationStaleEntry                = MutationStaleEntry
MutationForgetsOlderRetirement    = MutationForgetsOlderRetirement

SPECIFICATION Spec

INVARIANT
TypeOK
ViewIsCoherent
NoReaderAcquiresRetiredView
NoReaderDereferencesReleasedResource
ReleaseRequiresCertifiedQuiescence
