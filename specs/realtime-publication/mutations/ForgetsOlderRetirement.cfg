\* M4 负控制（可选扩展，已按 M1-M3 完成后补齐）ForgetsOlderRetirement：
\* 发布链 N -> N+1 -> N+2 下，quiescence 认证只检查“最新 retired 代”的
\* 读者是否退出，遗忘仍停留在更老 retired 视图（view 0，仍含 A/B）里的读者，
\* 导致被旧读者解引用的资源被提前认证为 reclaimable 并释放。
\* 预期：NoReaderDereferencesReleasedResource 必须失败。
CONSTANT
Readers                           = {r1, r2}
Resources                         = {A, B}
OldResource                       = A
ChainResource                     = B
MaxPublications                   = 2
Mutation                          = MutationForgetsOlderRetirement
MutationNone                      = MutationNone
MutationReleaseBeforeQuiesce      = MutationReleaseBeforeQuiesce
MutationSplitPublication          = MutationSplitPublication
MutationStaleEntry                = MutationStaleEntry
MutationForgetsOlderRetirement    = MutationForgetsOlderRetirement

SPECIFICATION Spec

INVARIANT
TypeOK
ViewIsCoherent
NoReaderAcquiresRetiredView
NoReaderDereferencesReleasedResource
ReleaseRequiresCertifiedQuiescence
