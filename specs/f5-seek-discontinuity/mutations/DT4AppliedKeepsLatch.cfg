\* D-T4 负控制 — Applied 不擦除 latch（单缺陷，2026-10-17 终审 P2 更正：
\* worker 去向保持正常 repositioned）→ 新 continuation 的下一次读复现旧
\* fatal → 非法 failure publication；surfacing 全程链入反例。
\*
\* 检查 DiagnosticNoFailurePublicationAfterLanding（NoOldFatalAfterApplied
\* 的 publication 半边，诊断性命名检查）：全称版会在 landing 时刻（stale
\* latch 残留处）提前触发，反例走不完 surfacing 链；本诊断只在发布动作
\* 处触发，强制反例包含完整交错。
\*
\* 期望：目标不变式必须被违反（MUST-FAIL）。
CONSTANT MAX_TAIL = 2

Mutation = MutationAppliedKeepsLatch
MutationNone = MutationNone
MutationCommitBeforeTailPurge = MutationCommitBeforeTailPurge
MutationSeekMidWrite = MutationSeekMidWrite
