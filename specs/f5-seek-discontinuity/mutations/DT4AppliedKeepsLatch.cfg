MutationRefusalDropsRemainder = MutationRefusalDropsRemainder
MutationResumeAfterMutatedSeek = MutationResumeAfterMutatedSeek
MutationOldCursorResumeAfterApplied = MutationOldCursorResumeAfterApplied
MutationRefusedClearsLatch = MutationRefusedClearsLatch
MutationLoopTopStopExit = MutationLoopTopStopExit
