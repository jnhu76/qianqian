\* M2 负控制 — 纯等待动作偷偷提交（Wait 调用 settlement）。
\*
\* 这正是今日生产 wait() -> resolve() differential 的形状：consumer 触发
\* 的 settlement。当前 accepted contract（D11 settlement ownership）下
\* wait 必须是纯等待，因此本 mutation 必须被抓住。与 M1 分开成 run：
\* Observe 与 Wait 的纯性各自独立成立，不因 UNCHANGED 而空洞。
\* 提交值按边界 intent 正确计算，但写入 transition 不是 AuthoritySettle。
\*
\* 期望：AuthorityIsSoleWriter（temporal）必须被违反，且状态不变式保持
\* 绿色（值正确 => 值类不变式不响；writer identity 只能由 transition
\* 级性质承载）。
