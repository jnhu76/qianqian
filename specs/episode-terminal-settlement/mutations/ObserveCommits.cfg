\* M1 负控制 — 纯读动作偷偷提交（Observe 顺带 settlement）。
\*
\* 把 D14.2 observe 从纯读变成 writer（模拟：read seam 顺带 resolve 了
\* authority）。提交值按边界 intent 正确计算，但写入 transition 不是
\* AuthoritySettle——semantic writer 归属 authority 角色，不因值正确而
\* 转移（PBK-001 §2.3 / D11 firewall）。
\*
\* 期望：AuthorityIsSoleWriter（temporal）必须被违反，且状态不变式保持
\* 绿色（值正确 => 值类不变式不响；writer identity 只能由 transition
\* 级性质承载）。
CONSTANT
Mutation                                  = MutationObserveCommits
MutationNone                              = MutationNone
MutationObserveCommits                    = MutationObserveCommits
MutationWaitCommits                       = MutationWaitCommits
MutationTerminalRewritable                = MutationTerminalRewritable
MutationLateStopReadsCurrentIntent        = MutationLateStopReadsCurrentIntent
MutationTeardownBeforeSettlement          = MutationTeardownBeforeSettlement
MutationActivationFailureBecomesFailed    = MutationActivationFailureBecomesFailed
MutationFalseCompleted                    = MutationFalseCompleted
MutationFalseStopped                      = MutationFalseStopped
MutationEvidenceProducerSpoofsAuthority = MutationEvidenceProducerSpoofsAuthority
MutationNarrowDecisiveDomain              = MutationNarrowDecisiveDomain

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT
TypeOK
EvidenceConsistent
BoundaryLatchedWhenDecisive
TerminalOutcomeImmutable
NoFalseCompleted
NoFalseStopped
CommittedOutcomeMatchesContract
ActivationFailureIsNotTerminalFailed
DiagnosticActivationFailureLeavesOutcomeUncommitted
TeardownRequiresSettlement

PROPERTY
AuthorityIsSoleWriter
