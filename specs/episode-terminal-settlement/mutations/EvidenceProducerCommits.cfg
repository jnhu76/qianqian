\* M9 负控制 — evidence 发布者自己写 terminalOutcome。
\*
\* PublishWorkerEof 在证据决定性时顺手提交（B′ 的"提交与证据同步"形状，
\* 由 mechanism provider 而非 authority 执行）——mechanism observation
\* 不得发布另一个 authority 的 semantic fact（PBK-001 §2.3 / D11 firewall）。
\* mutation 不登记 authoritySettled，writer 集合不变式必须发现它。
\*
\* 注意：这不代表 production 永远不能在同一 Rust call stack 内由 authority
\* 完成 decision+commit；它检查的是 semantic writer 必须归属 authority 角色，
\* 而不是 evidence producer 自己成为另一个 authority（README 详述）。
\*
\* 期望：OutcomeWrittenOnlyByAuthoritySettle 必须被违反。
CONSTANT
Mutation                                  = MutationEvidenceProducerCommits
