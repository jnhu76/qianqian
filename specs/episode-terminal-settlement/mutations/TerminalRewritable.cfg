\* M3 负控制 — 已提交终局可被 late stop 改写。
\*
\* RequestStop 把已提交的 Completed/Failed 改写成 Stopped，违反
\* cardinality/immutability contract（D11：一个 episode 至多一个 terminal
\* outcome，一旦 commit 即不可改写）。
\*
\* 期望：TerminalOutcomeImmutable 必须被违反。
CONSTANT
Mutation                                  = MutationTerminalRewritable
MutationNone                              = MutationNone
MutationObserveCommits                    = MutationObserveCommits
MutationWaitCommits                       = MutationWaitCommits
MutationTerminalRewritable                = MutationTerminalRewritable
MutationLateStopReadsCurrentIntent        = MutationLateStopReadsCurrentIntent
MutationTeardownBeforeSettlement          = MutationTeardownBeforeSettlement
MutationActivationFailureBecomesFailed    = MutationActivationFailureBecomesFailed
MutationFalseCompleted                    = MutationFalseCompleted
MutationFalseStopped                      = MutationFalseStopped
MutationEvidenceProducerCommits           = MutationEvidenceProducerCommits

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT
TerminalOutcomeImmutable

