\* M9 负控制（corrective 轮强化为最大对手）— evidence 发布者冒充 authority
\* 提交 terminal Fact。
\*
\* PublishWorkerEof 在证据决定性时执行 AuthoritySettle 的**全部**状态效果：
\* 判决值按边界 intent 正确计算、firstCommitted 如实维护。它不是"忘记登记
\* ghost"的粗糙冒写——状态层面它与 authority 提交不可区分：全部安全不变式
\* （S2/S6/S7/S9/C5……）在本 run 中必须保持绿色。
\* 唯一能抓住它的是 S3 的 transition 级性质：改变 outcome 的 transition
\* 必须就是 AuthoritySettle（PBK-001 §2.3 / D11：semantic writer 归属
\* authority 角色，不因值正确而转移）。
\*
\* 注意：这不代表 production 永远不能在同一 Rust call stack 内由 authority
\* 完成 decision+commit；它检查的是 writer 必须归属 authority 角色，
\* 而不是 evidence producer 自己成为另一个 authority（README 详述）。
\*
\* 期望：AuthorityIsSoleWriter（temporal）必须被违反，且**零**状态不变式
\* 被违反——这正是状态不变式无法承载 writer identity 的机器证明。
CONSTANT
Mutation                                  = MutationEvidenceProducerSpoofsAuthority
