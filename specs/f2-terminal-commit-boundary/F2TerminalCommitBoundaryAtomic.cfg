\* 变体 B′ — commit atomic with the decisive evidence publication（诊断性扩展）。
\*
\* Ownership = OwnershipAtomicWithEvidence：提交不做延迟解析——哪一步发布了
\* "最后一块决定性证据"，就在那一步同时提交。authority 仍然拥有提交权，
\* 只是提交与其决定依据不再分离。
\*
\* 这是三种变体里唯一把 "证据决定性 ⇒ Fact 已存在" 变成 **safety** 的形态：
\* 它把 Fact 的存在性从"进度承诺"降级为"不变量"。零 fairness 假设即可成立
\* （CommitterFairness 对本变体取 TRUE）。
\*
\* 与 D11 的关系：D11 的 Completed/Stopped/Failed 命题对"提交发生在哪个瞬间"
\* 保持沉默；B′ 因此**不扩大**这些命题，只消除其未定的时间自由度。
\* 本文件是 formal evidence，不是对 ADR 的裁决——裁决留给下一轮 ADR/code gap audit。
CONSTANT
Ownership                         = OwnershipAtomicWithEvidence
OwnershipConsumerTriggered        = OwnershipConsumerTriggered
OwnershipAuthorityOwned           = OwnershipAuthorityOwned
OwnershipAtomicWithEvidence       = OwnershipAtomicWithEvidence
ConsumerEnvironment               = ConsumerPresent
ConsumerPresent                   = ConsumerPresent
ConsumerAbsent                    = ConsumerAbsent
