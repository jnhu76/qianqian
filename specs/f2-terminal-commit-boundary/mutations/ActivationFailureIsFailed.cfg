\* M5 负控制 — activation failure 被升格为 D11 terminal Failed。
\*
\* D11 firewall：activation_failure 是 mechanism observation / diagnostic，
\* 不是 terminal outcome 权威。本 mutation 让激活失败直接落一个 Failed 事实。
\* mutation 如实登记提交者，因此被击穿的必须是 S4 本身，而不是 writer 集合。
\*
\* 期望：ActivationFailureIsNotTerminalFailed 必须被违反
\*       （DiagnosticActivationFailureLeavesOutcomeUncommitted 一并被击穿）。
CONSTANT
Ownership                         = OwnershipConsumerTriggered
