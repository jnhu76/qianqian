\* 反向控制 — 本模型不得宣称「每首歌最终都会结束」。
\*
\* 变体 = AuthorityOwned；无 mutation。断言 EpisodesEventuallyTerminate（无条件终结），
\* 这条性质在本模型里**必须被违反**：模型只允许"证据决定性之后，Fact 最终
\* 被提交"这种带前提的进度陈述；它不承诺"证据一定会到来"（媒体一定 EOF、
\* device 一定 drain、decoder 一定不挂死），因此也不承诺每个 episode 一定终结。
\*
\* 若本 run PASS，说明模型偷偷承诺了超出 D11 授权范围的 liveness
\* （D11 明确写明是 cardinality/immutability contract，不是 liveness 承诺），
\* 那将是一个必须修掉的建模错误。
\*
\* 期望：EpisodesEventuallyTerminate 必须被违反。
CONSTANT
Ownership                         = OwnershipAuthorityOwned
OwnershipConsumerTriggered        = OwnershipConsumerTriggered
OwnershipAuthorityOwned           = OwnershipAuthorityOwned
OwnershipAtomicWithEvidence       = OwnershipAtomicWithEvidence
ConsumerEnvironment               = ConsumerPresent
ConsumerPresent                   = ConsumerPresent
ConsumerAbsent                    = ConsumerAbsent
Mutation                          = MutationNone
MutationNone                      = MutationNone
MutationObserveCommits            = MutationObserveCommits
MutationTerminalRewritable        = MutationTerminalRewritable
MutationWaitIsSoleResolver        = MutationWaitIsSoleResolver
MutationAuthorityResolverRemoved  = MutationAuthorityResolverRemoved
MutationActivationFailureIsFailed = MutationActivationFailureIsFailed
MutationResolverIgnoresEvidence   = MutationResolverIgnoresEvidence
MutationStopDiscriminatorRemoved  = MutationStopDiscriminatorRemoved
MutationFailureDowngraded         = MutationFailureDowngraded
MutationTeardownBeforeLegsJoined  = MutationTeardownBeforeLegsJoined

CHECK_DEADLOCK FALSE

SPECIFICATION SpecAuthorityOwned

INVARIANT
TypeOK
EvidenceConsistent
TerminalOutcomeImmutable
OutcomeWrittenOnlyByContractCommitter
NoFalseCompleted
NoFalseStopped
ActivationFailureIsNotTerminalFailed
DiagnosticActivationFailureLeavesOutcomeUncommitted
TeardownImpliesDecisive
ScenarioNaturalEof
ScenarioUserStop
ScenarioDeviceAbortWithoutStop
ScenarioDecodeFailureNeverStopped

PROPERTY
EpisodesEventuallyTerminate
