\* M7 负控制（precedence）— 去掉 stop 意图区分器。
\*
\* 判决函数里把 "Aborted + worker Stopped" 一律判为 Failed（不再看 stop 意图），
\* 即模拟"设备死因优先于用户 stop"的另一种 decision table。
\*
\* 目的（fresh adversarial review MAJOR-1 的封闭措施）：证明 ScenarioUserStop
\* 不是装饰——它是对 current realization 区分器的机器检查，不是 D11 命题本身。
\* 同一 run 里 ownership / boundary 侧的结论不受影响（见 report 的 Q5 处理）。
\*
\* 期望：ScenarioUserStop 必须被违反。
