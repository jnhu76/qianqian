\* M6 负控制 — resolver 忽略证据直接判决。
\*
\* 判决函数本身被污染（恒返回 Completed），提交所有权**不变**：
\* 这是刻意设计，用来把"判决内容"与"提交所有权"两件事分开——
\* 同一 mutation 下 writer 集合不变式仍应成立，崩掉的只有
\* "不得虚构终局"这类以证据为依据的性质。
\*
\* 期望：NoFalseCompleted 必须被违反（S5 非空洞性）。
CONSTANT
Ownership                         = OwnershipConsumerTriggered
OwnershipConsumerTriggered        = OwnershipConsumerTriggered
OwnershipAuthorityOwned           = OwnershipAuthorityOwned
OwnershipAtomicWithEvidence       = OwnershipAtomicWithEvidence
ConsumerEnvironment               = ConsumerPresent
ConsumerPresent                   = ConsumerPresent
ConsumerAbsent                    = ConsumerAbsent
Mutation                          = MutationResolverIgnoresEvidence
MutationNone                      = MutationNone
MutationObserveCommits            = MutationObserveCommits
MutationTerminalRewritable        = MutationTerminalRewritable
MutationWaitIsSoleResolver        = MutationWaitIsSoleResolver
MutationAuthorityResolverRemoved  = MutationAuthorityResolverRemoved
MutationActivationFailureIsFailed = MutationActivationFailureIsFailed
MutationResolverIgnoresEvidence   = MutationResolverIgnoresEvidence

CHECK_DEADLOCK FALSE

SPECIFICATION SpecConsumerTriggered

INVARIANT
TypeOK
TerminalOutcomeImmutable
OutcomeWrittenOnlyByContractCommitter
NoFalseCompleted
NoFalseStopped
