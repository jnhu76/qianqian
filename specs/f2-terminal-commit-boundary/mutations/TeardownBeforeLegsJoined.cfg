\* M8 负控制 — teardown 可以在两条 leg join 之前完成。
\*
\* 去掉 FinishTeardown 的 join 纪律守卫，模拟"teardown 完成时证据其实还没齐"。
\* 目的：证明 TeardownImpliesDecisive 是**承重**的推导——
\* 它成立完全依赖 join 语义（join 返回 ⇒ worker_exited / drain.complete 已发生），
\* 一旦这条现实纪律不成立，本报告 B2 那句"teardown 之后缺的不是证据，是判决"
\* 就不再成立。也就是说：B2 的结论挂在一条真实的实现纪律上，不是凭空假设。
\*
\* 期望：TeardownImpliesDecisive 必须被违反。
