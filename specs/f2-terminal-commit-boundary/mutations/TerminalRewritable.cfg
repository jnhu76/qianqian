\* M2 负控制 — 已提交的 terminal 可被 late stop 改写。
\*
\* 模拟：RequestStop 直接覆盖已提交的 Completed/Failed（现实里
\* resolve() 的 `if state.outcome.is_some() { return }` 与 edge 的
\* first-wins terminal 都在防这件事）。
\*
\* 期望：TerminalOutcomeImmutable 必须被违反（S1b/S3），
\*       同时 NoFalseStopped 一并被击穿（伪造 Stopped 的附带杀伤）。
CONSTANT
