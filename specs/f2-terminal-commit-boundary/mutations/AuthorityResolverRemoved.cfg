\* M4 负控制（liveness 侧）— authority 侧提交动作整体移除。
\*
\* B/B′ 的提交点上不存在任何外部触发；拿掉 authority 的提交动作后，
\* 任何 path 都不能提交（外部 wait/observe 在 B 语义下是纯的）。
\* mutation 同时关闭 B 的 AuthorityResolve 与 B′ 的证据同步提交。
\*
\* 期望：TerminalEvidenceCommitsEventually 必须被违反
\*       （证明该进度性质不是空洞的，且它确实由 authority 侧动作承载）。
CONSTANT
Ownership                         = OwnershipAuthorityOwned
