\* 命名诊断 witness（B）— "device abort 已决定性但尚未提交"的窗口可达。
\*
\* 窗口 = 证据已决定性（Failed）而 Fact 尚未提交的中间状态；在这段窗口里
\* 一个 late stop 会改变**判决内容**（Failed -> Stopped，D11 的
\* "at terminal semantic resolution" 口径允许它，因为 resolution 尚未发生）。
\* 本探针只取证"窗口存在"，不裁决它是否应当存在。
\*
\* 期望：DiagnosticPendingDeviceAbortUnreachable 被违反（witness found）。
\* 同一断言在 F2TerminalCommitBoundaryAtomic.cfg（B′）中必须 PASS。
