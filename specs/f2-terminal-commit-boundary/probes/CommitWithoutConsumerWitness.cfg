\* 正向控制 / 反例取证（B）— 提交可以在完全没有 consumer 参与时发生。
\*
\* 变体 B + consumer 存在；断言 BoundaryCommitRequiresConsumer
\* （A 的特征命题："Fact 的存在依赖外部询问"）。
\* 该断言在 B 下**必须被违反**：authority 自己提交，consumerAsked 恒为 FALSE。
\*
\* 期望：BoundaryCommitRequiresConsumer 被违反（witness found）。
\* 与 F2TerminalCommitBoundary.cfg（A，同一算子 PASS）构成成对证据。
