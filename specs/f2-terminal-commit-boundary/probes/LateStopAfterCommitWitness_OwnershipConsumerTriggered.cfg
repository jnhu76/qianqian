\* 正向控制 witness（OwnershipConsumerTriggered）— "已提交 Fact + 晚到的 stop 意图"共存状态可达。
\*
\* 断言 DiagnosticLateStopAfterCommitUnreachable（该状态不可达），预期被违反。
\* 取证两件事：
\*   1. stop intent 是 command，不是 fact：它可以在终局已提交之后才到达；
\*   2. 到达之后**不追溯改写**已提交的终局——同一 run 里
\*      TerminalOutcomeImmutable 必须保持 PASS（S3 的行为证据）。
\* M2 负控制（mutations/TerminalRewritable.cfg）证明这条约束不是空洞的。
\*
\* 期望：DiagnosticLateStopAfterCommitUnreachable 被违反（witness found）。
