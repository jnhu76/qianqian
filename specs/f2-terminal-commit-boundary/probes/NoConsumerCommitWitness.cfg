\* 正向控制（B + 无 consumer）— 没有外部 consumer 时，提交**可达**。
\*
\* 同一断言 NeverCommitted 在 B 下必须被违反：authority 拥有提交动作，
\* 整个 episode 期间没有任何外部参与者，Fact 依然成立。
\*
\* 期望：NeverCommitted 被违反（witness found）。
