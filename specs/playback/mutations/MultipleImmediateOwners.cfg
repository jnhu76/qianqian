\* 负控制：DecodeSession 创建时被赋予两个 immediate lifetime owner
\* 预期：UniqueImmediateLifetimeOwner 必须失败（counterexample）
CONSTANT
Mutation                          = MutationMultipleImmediateOwners
MutationNone                      = MutationNone
MutationReleaseProviderEarly      = MutationReleaseProviderEarly
MutationMultipleImmediateOwners   = MutationMultipleImmediateOwners
MutationOwnershipCycle            = MutationOwnershipCycle
MutationKernelAdoptsOwnership     = MutationKernelAdoptsOwnership

SPECIFICATION Spec

INVARIANT
  UniqueImmediateLifetimeOwner
  TypeOK
  OwnershipReachesLifecycleRoot
  OwnershipIsAcyclic
  DecodeSessionsOwnedByTrackSessions
  TrackSessionsOwnedByMusicComponent
  SemanticAuthoritiesHoldNoLifetimeOwnership
  ProviderFinalReleaseRequiresDependentExit
  TrackSessionGoneImpliesDecodeSessionsDischarged
  MusicComponentGoneImpliesSubordinatesExited
