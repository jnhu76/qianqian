\* 负控制：删除 promotion 前的 fence 成功条件（保留 close admission 骨架顺序）
\* 预期：PromotionRequiresSuccessfulFence 必须失败（counterexample）
CONSTANT
Mutation                          = MutationPromoteWithoutFence
MutationNone                      = MutationNone
MutationPromoteWithoutFence       = MutationPromoteWithoutFence
MutationAcceptUnadmittedDecode    = MutationAcceptUnadmittedDecode
MutationSingleGlobalGeneration    = MutationSingleGlobalGeneration
MutationRetiredStillAdmitted      = MutationRetiredStillAdmitted
MutationEndBeforeRenderDrain      = MutationEndBeforeRenderDrain

SPECIFICATION Spec

INVARIANT
  PromotionRequiresSuccessfulFence
  TypeOK
  AtMostOneActiveWindow
  AtMostOnePreparedWindow
  ActivePreparedGenerationsDistinct
  PreparedWindowsAreAdmitted
  RetiredGenerationCannotReenter
  DecodeResultRequiresAdmission
  SubmissionsBackedByAdmittedDecodes
  PendingMediaOnlyInActiveWindow
  PreparedWindowIsNotOutputAuthority
  RenderedNeverExceedsSubmitted
  FenceFlushedGenerationsAreSilent
  TransportDrainRequiresRenderedDrain
  EndedRequiresTransportDrain
  StopFenceRequiresActiveWindow
